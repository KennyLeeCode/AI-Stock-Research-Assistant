[pytest]
testpaths = tests
pythonpath = .

# Every async test is run without needing an explicit marker.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    --strict-markers
    --strict-config
    -ra

filterwarnings =
    error
    # Starlette's TestClient still imports httpx; the replacement is not
    # released yet. Downgraded so it does not fail the suite.
    ignore::DeprecationWarning:starlette.testclient
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning
