# Serves the built single-page app and proxies the API.
#
# Proxying /api here rather than pointing the browser at the backend directly
# is what keeps the deployment simple: every request is same-origin, so there
# is no CORS configuration to get wrong, no backend hostname compiled into the
# JavaScript bundle, and nothing about the backend exposed to the client.

server {
    # 8080, not 80: the unprivileged nginx image runs as a non-root user, which
    # cannot bind ports below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The upstream sets its own; a second one confuses proxies and caches.
    server_tokens off;

    # ---- Security headers ----
    # This app has no frames, no plugins, and never posts credentials
    # cross-origin, so these can be strict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ---- API proxy ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous read timeout: generating a research report waits on a
        # language model and can legitimately take a minute. The default 60s
        # would cut off a request that was going to succeed.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Stream the response through rather than buffering it whole.
        proxy_buffering off;
    }

    # ---- Hashed build assets ----
    # Vite fingerprints these filenames, so the content at a given URL can never
    # change. Caching them for a year is safe and makes repeat visits instant.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    # Any unmatched path returns index.html so client-side routing works on a
    # hard refresh or a shared deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a browser will keep loading an
    # old build that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }
}
